[package]
name = "age-civ-mod-tool-ui"
version = "0.2.4"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-logger = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
# 国策记录镜像需要携带「未知字段」（serde flatten + JSON 值），故为常规依赖
# （原先仅在 dev-dependencies 供测试使用）。wasm 端 serde-wasm-bindgen 的
# deserialize_any 支持 Value，可直接从 JS 值往返。
serde_json = "1"
serde-wasm-bindgen = "0.6"

[workspace]
members = ["src-tauri"]
